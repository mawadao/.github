<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#24243e"/>
      <stop offset="1" stop-color="#302b63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7b733"/>
      <stop offset="1" stop-color="#fc4a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#7f5af0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7f5af0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="220" fill="url(#glow)"/>
  <circle cx="180" cy="260" r="180" fill="url(#glow)"/>

  <!-- network / community nodes -->
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5">
    <line x1="80" y1="60" x2="220" y2="40"/>
    <line x1="220" y1="40" x2="340" y2="100"/>
    <line x1="80" y1="60" x2="150" y2="150"/>
    <line x1="1000" y1="240" x2="1120" y2="270"/>
    <line x1="1120" y1="270" x2="1200" y2="200"/>
    <line x1="960" y1="60" x2="1080" y2="50"/>
    <line x1="1080" y1="50" x2="1160" y2="110"/>
  </g>
  <g fill="#f7b733">
    <circle cx="80" cy="60" r="4"/>
    <circle cx="220" cy="40" r="3"/>
    <circle cx="340" cy="100" r="4"/>
    <circle cx="150" cy="150" r="3"/>
    <circle cx="1000" cy="240" r="4"/>
    <circle cx="1120" cy="270" r="3"/>
    <circle cx="1200" cy="200" r="4"/>
    <circle cx="960" cy="60" r="3"/>
    <circle cx="1080" cy="50" r="4"/>
    <circle cx="1160" cy="110" r="3"/>
  </g>

  <!-- wordmark -->
  <text x="640" y="150" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="88" font-weight="700" fill="#ffffff" letter-spacing="6">MAWA<tspan fill="url(#accent)" dx="28">DAO</tspan></text>
  <text x="640" y="188" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="16" font-weight="400" fill="url(#accent)" letter-spacing="7">DECENTRALIZED AUTONOMOUS ORGANIZATION</text>

  <!-- tagline -->
  <text x="640" y="240" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="18" fill="#d8d6f0" letter-spacing="1">Open Source&#160;&#160;•&#160;&#160;AI &amp; Agents &amp; MCP&#160;&#160;•&#160;&#160;Web3 &amp; Blockchain</text>

  <!-- divider -->
  <rect x="540" y="262" width="200" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="640" y="292" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#a9a6cc" letter-spacing="1">Community-owned. Community-governed. Built to give back.  •  mawadao.com</text>
</svg>
